name: Build EVE site for Google

on:
  push:
    branches: [main]          # every time you upload a new index.html
  schedule:
    - cron: "17 13 * * *"     # every morning (~6am San Francisco) to pick up new events
  workflow_dispatch:          # "Run workflow" button — use right after publishing an event

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build site
        run: node seo/build.js
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
